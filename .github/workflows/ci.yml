name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The Node version the Vercel project runs.
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pipeline/worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build needs no secrets: the database, auth and API keys are read on
      # first use, never at build time.
      - run: npm run build
      # After the build, so the route types Next generates in .next/types exist.
      - run: npm run typecheck
      # The data pipeline's worker has its own package. Its pure modules are already
      # covered by `npm test`; this typechecks the services, which import app code
      # that needs next-env.d.ts from the build above.
      - run: npm ci
        working-directory: pipeline/worker
      - run: npm run typecheck
        working-directory: pipeline/worker

  # The Airflow DAG's pure modules. The DAG integrity test needs Airflow itself, so it's
  # skipped here and run inside the container (see pipeline/README.md).
  pipeline-airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/airflow/requirements-test.txt
      - run: pip install -r pipeline/airflow/requirements-test.txt
      - run: python -m pytest pipeline/airflow/tests
