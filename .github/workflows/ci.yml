name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The Node version the Vercel project runs.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build needs no secrets: the database, auth and API keys are read on
      # first use, never at build time.
      - run: npm run build
      # After the build, so the route types Next generates in .next/types exist.
      - run: npm run typecheck
